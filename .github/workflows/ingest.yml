name: ingest
on:
  schedule:
    - cron: "30 1 * * *"   # 7:00 AM IST
    - cron: "30 7 * * *"   # 1:00 PM IST
    - cron: "30 13 * * *"  # 7:00 PM IST
  workflow_dispatch:
permissions:
  actions: write   # lets the keep-alive step below reset GitHub's 60-day inactivity timer
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ingest.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_ID: 69e1b5a7-6c62-47a4-b164-cd9d6c94dbbb
      - name: Keep schedule alive
        run: gh workflow enable ingest.yml || true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
